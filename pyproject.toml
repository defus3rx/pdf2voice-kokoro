[project]
name = "pdf2voice"
version = "0.1.0"
description = "Turn any PDF into narrated audio with Kokoro TTS, locally and offline."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "kokoro>=0.9.2",
    "soundfile>=0.12",
    "pymupdf>=1.24",
    "torch>=2.4",
    "numpy",
    "tqdm>=4.66",
    # Kokoro's English phonemizer (misaki) loads this spaCy model; pinning it here means
    # it is installed with the package instead of being fetched at first run.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
pdf2voice = "pdf2voice.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pdf2voice"]
